    <!-- JavaScript xử lý logic lọc -->
    <script type="text/javascript">
        $(document).ready(function () {
            // Khởi tạo Select2
            $('#ddlCapHoc').select2({ placeholder: "Chọn Cấp học" });
            $('#ddlPhuongXa').select2({ placeholder: "Chọn Phường/Xã" });
            $('#ddlTruong').select2({ placeholder: "Chọn trường" });

            function updateFormLogic() {
                var selectedLevel = $('#ddlCapHoc').val();
                var selectedWard = $('#ddlPhuongXa').val();
                var $wardSelect = $('#ddlPhuongXa');

                if (selectedLevel === 'THPT' || selectedLevel === 'GDTX') {
                    $wardSelect.val('').prop('disabled', true).trigger('change.select2');
                    selectedWard = '';
                } else {
                    $wardSelect.prop('disabled', false).trigger('change.select2');
                }

                $('#ddlTruong option').each(function () {
                    var $opt = $(this);
                    if ($opt.val() === "") return;

                    var optLevel = $opt.attr('data-level');
                    var optWard = $opt.attr('data-ward');

                    var matchLevel = (optLevel === selectedLevel);
                    var matchWard = (selectedLevel === 'THPT' || selectedLevel === 'GDTX') ? true : (!selectedWard || optWard === selectedWard);

                    if (matchLevel && matchWard) {
                        $opt.prop('disabled', false);
                    } else {
                        $opt.prop('disabled', true);
                    }
                });

                $('#ddlTruong').val("").trigger('change.select2');
            }

            $('#ddlCapHoc').on('change', function () {
                updateFormLogic();
            });

            $('#ddlPhuongXa').on('change', function () {
                updateFormLogic();
            });

            updateFormLogic();

            // Captcha Logic
            var currentCaptcha = "";
            function generateCaptcha() {
                var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
                var code = "";
                for (var i = 0; i < 6; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                currentCaptcha = code;
                $('#lblCaptchaCode').text(code.split('').join(' '));
            }
            generateCaptcha();

            $('#btnRefreshCaptcha').click(function () {
                generateCaptcha();
                $('#txtCaptchaInput').val('').focus();
            });

            // Nút Đăng nhập
            $('#btnSubmitLogin').click(function () {
                var username = $('#tbUsername').val().trim();
                var password = $('#tbPassword').val().trim();
                var userInput = $('#txtCaptchaInput').val().trim().replace(/\s+/g, '');

                if (username === "") {
                    alert("Vui lòng nhập Tên đăng nhập!");
                    $('#tbUsername').focus();
                    return;
                }
                if (password === "") {
                    alert("Vui lòng nhập Mật khẩu!");
                    $('#tbPassword').focus();
                    return;
                }
                if (userInput === "") {
                    alert("Vui lòng nhập mã xác nhận (Captcha)!");
                    $('#txtCaptchaInput').focus();
                    return;
                }

                if (userInput.toUpperCase() === currentCaptcha.toUpperCase()) {
                    alert("Đăng nhập thành công!");
                } else {
                    alert("Mã xác nhận không chính xác. Vui lòng thử lại!");
                    $('#txtCaptchaInput').val('');
                    generateCaptcha();
                    $('#txtCaptchaInput').focus();
                }
            });
        });
    </script>
</body>
